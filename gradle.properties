# Set JVM arguments for the Gradle Daemon.
#  -Xmx2048m: Sets the maximum heap size for the JVM to 2048 megabytes (2 GB). This limits the amount of memory the JVM can use for object allocation.
#  -Dfile.encoding=UTF-8: Sets the default file encoding to UTF-8, ensuring consistent character encoding for file I/O operations.
