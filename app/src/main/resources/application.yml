spring:
  application:
    name: kotlin-spring-boot-baseline

  r2dbc:
    # Example URL using connection pool
    # Format: r2dbc:pool:postgresql://<host>:<port>/<database>
    url: ${R2DBC_URL:r2dbc:pool:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Default profile is 'worker' for background processing
  profiles:
    default: worker

# Logging Configuration
logging:
  level:
    root: INFO
    org.example: INFO

# SPSC (Single Producer, Single Consumer) Configuration
app:
  spsc:
    # Path to the CSV file containing events
    csv-path: ${APP_SPSC_CSV_PATH:./events.csv}
    # Directory to store bookmarks
    bookmarks-dir: ${APP_SPSC_BOOKMARKS_DIR:./bookmarks}
    # Name for the bookmark (consumer progress checkpoint)
    bookmark-name: ${APP_SPSC_BOOKMARK_NAME:default-consumer}
    # Batch size for event production
    producer-batch-size: ${APP_SPSC_PRODUCER_BATCH_SIZE:2}
    # Batch size for event consumption
    consumer-batch-size: ${APP_SPSC_CONSUMER_BATCH_SIZE:2}
    # Maximum queue depth between producer and consumer
    max-queue-depth: ${APP_SPSC_MAX_QUEUE_DEPTH:5}
    # Number of consecutive empty batches before producer exits (0 = run indefinitely)
    producer-empty-batch-threshold: ${APP_SPSC_PRODUCER_EMPTY_BATCH_THRESHOLD:0}
    # Whether to enable SPSC processing on startup
    enabled: ${APP_SPSC_ENABLED:true}

# Server config only needed for API profile
# server:
#   port: ${SERVER_PORT:8080}

# management:
#   endpoints:
#     web:
#       exposure:
#         include: health,info

---
# API profile: reactive web application
spring:
  config:
    activate:
      on-profile: api
  main:
    web-application-type: reactive

---
# Worker profile: background service without any web server
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none